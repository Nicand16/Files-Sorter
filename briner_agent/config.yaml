app:
  name: "Briner"
  version: "1.3.0"
  description: "AI Autonomous Agent for File Management"

monitoring:
  mode: "interval"
  workspace_dir: "./workspace"
  poll_interval: 3600
  dry_run: false
  recursive: false
  debounce_seconds: 2
  ignore_existing_categories: true
  ignored_filenames: [".keep", "desktop.ini"]
  ignored_patterns: ["~$*", "*.tmp", "*.temp", "*.crdownload", "*.part"]
  destination_aliases:
    "Universidad y Estudio": "1. Universidad y Estudio"
    "Software y Herramientas": "2. Software y Herramientas"
    "Juegos y Emulacion": "3. Juegos y Emulacion"
    "Multimedia": "4. Multimedia"
    "Trabajo y Empleo": "5. Trabajo y Empleo"
    "Documentos Personales": "6. Documentos Personales"
    "Varios": "7. Varios"

database:
  sqlite_path: "./db/briner.db"

llm:
  model: "gemini-2.5-flash"
  temperature: 0.2

rules:
  fallback_documents_to_varios: false
  ambiguous_document_fallback_category: "Varios/Documentos por Revisar"

processing:
  max_workers: 2
  max_files_per_cycle: 500
  llm_batch_size: 50
  llm_individual_threshold: 6
  llm_bulk_content_max_chars: 700
  llm_individual_content_max_chars: 3000
  local_context_min_confidence: 0.84
  varios_min_confidence: 0.82
  llm_timeout_seconds: 60
  error_retry_seconds: 60
  circuit_breaker_threshold: 3
  circuit_breaker_recovery_seconds: 60
  decision_cache_size: 200
  decision_cache_ttl_seconds: 3600

parsing:
  max_chars: 3000

taxonomy:
  categories:
    - category: "Universidad y Estudio/Actividades y Tareas"
      keywords: ["actividad", "taller", "protocolo", "ensayo", "tcc", "algebra", "calculo", "bd1", "ejercicio", "tarea", "produccion textual", "parcial", "quiz", "evaluacion", "laboratorio", "entrega", "rubrica"]
    - category: "Universidad y Estudio/Material de Estudio y Modulos"
      keywords: ["modulo", "libro", "guia", "manual", "normas apa", "glosario", "latex", "tex", "syllabus", "clase", "lectura", "diapositivas"]
    - category: "Universidad y Estudio/Tramites Academicos"
      keywords: ["reglamento", "acuerdo", "recibo", "matricula", "diploma", "certificado_1002", "certificado academico", "constancia de estudio", "notas", "calificaciones", "homologacion", "inscripcion"]
    - category: "Trabajo y Empleo/CVs y Portafolios"
      keywords: ["cv", "resume", "hoja de vida", "curriculum", "portfolio", "portafolio"]
    - category: "Trabajo y Empleo/Procesos de Seleccion"
      keywords: ["interview", "oferta", "entrevista", "technical support", "simetrik", "openprovider", "js held", "contract", "prueba_tecnica", "prueba tecnica", "ticket", "recruiter", "reclutador", "job offer", "contrato laboral"]
    - category: "Documentos Personales/Identificacion e Impuestos"
      keywords: ["cedula", "rut", "identificacion", "passport", "pasaporte", "visa", "dni", "tax", "impuesto", "declaracion de renta"]
    - category: "Documentos Personales/Finanzas y Salud"
      keywords: ["certificado", "factura", "comprobante", "pago", "afiliacion", "eps", "receipt", "recibo de pago", "banco", "extracto", "cuenta", "medico", "salud", "historia clinica", "laboratorio clinico"]
    - category: "Juegos y Emulacion/Torrents"
      extensions: [".torrent"]
    - category: "Juegos y Emulacion/ROMs e ISOs"
      extensions: [".nsp", ".rvz", ".iso", ".srm", ".xci"]
    - category: "Juegos y Emulacion/Emuladores y Mods"
      keywords: ["yuzu", "cemu", "sudachi", "ryujinx", "retrobat", "mario", "zelda", "pokemon", "dolphin", "snes9x"]
    - category: "Multimedia/Audio y Musica"
      extensions: [".mp3", ".wav", ".flac", ".ogg"]
    - category: "Multimedia/Videos y Grabaciones"
      extensions: [".mp4", ".mkv", ".mov", ".avi"]
    - category: "Multimedia/Imagenes y Capturas"
      extensions: [".jpg", ".jpeg", ".png", ".gif", ".webp", ".bmp"]
    - category: "Software y Herramientas/Instaladores"
      extensions: [".exe", ".msi"]
    - category: "Software y Herramientas/Comprimidos y Portables"
      extensions: [".zip", ".rar", ".7z"]
